services:
  dashboard:
    build: .
    container_name: dashboard
    ports:
      - "8080:8080" # Maps host port 4001 to container port 8080
    environment:
          - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/database.db
    volumes:
      - /home/kian/dashboard-data:/app/data # Keeps your SQLite database safe across container restarts
