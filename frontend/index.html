<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kianserver Dashboard for monitoring various services and media.">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <title>Server Dashboard</title>
</head>

<body>

    <div id="loading">
        <h1>LOADING...</h1>
    </div>
    <div id="login">
        <form id="login-form">
            <h4>SIGN IN TO CONTINUE</h4>
            <input type="text" name="username" class="username" placeholder="Username" required>
            <input type="password" name="password" class="password" placeholder="Password" required>
            <div id="login-error-msg"></div>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="dashboard">
        <div id="title-bar">
            <div id="icon"><img src="icon.ico" alt="Dashboard Icon"></div>
            <div id="title">Kianserver Dashboard</div>
            <div id="open-edit-link-form-buttom">NEW</div>
            <div id="activate-edit-mode-button">EDIT MODE</div>
            <div id="logout" class="btn" target="_blank" aria-label="Logout">
                <img src="logout.png" alt="Logout Icon">
            </div>
        </div>

        <form id="search" action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Search the web" aria-label="Search">
            <button type="submit" aria-label="Submit Search">
                <img src="search (1).png" alt="Search Icon">
            </button>
        </form>

        <div id="edit-link-div" class="form-div">
            <form id="edit-link-form" class="form">
                <h4>Enter details to create new link</h4>
                <input type="text" name="name" placeholder="name">
                <input type="text" name="localIp" placeholder="local ip address">
                <input type="text" name="remoteIp" placeholder="remote ip address">
                <input type="text" name="imgUrl" placeholder="image icon url">
                <button type="submit">Create</button>
            </form>
        </div>
        <div id="edit-link-buffer"></div>

        <div id="container">
            <div class="column">
                <div class="heading">Media</div>

                <div class="btn-container" id="col-1">
                </div>

            </div>
            <div class="column">
                <div class="heading">Services</div>

                <div class="btn-container" id="col-2">
                </div>

            </div>
            <div class="column">
                <div class="heading">Links</div>

                <div class="btn-container" id="col-3">
                </div>

            </div>
            <div class="column">
                <div class="heading">Admin</div>
                <div class="btn-container" id="col-4">
                </div>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
